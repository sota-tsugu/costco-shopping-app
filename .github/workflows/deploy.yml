name: Deploy to GitHub Pages

# mainブランチにpushされるたびに、自動でビルド(コードを実際に動く
# 形に変換すること)して、GitHub Pagesへ公開する。
# 手動で実行したいときのために workflow_dispatch も付けておく。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 依存パッケージ(node_modules)をキャッシュし、package.jsonの内容が
      # 変わっていなければ再利用することで、npm installを毎回ゼロから
      # やり直さずに済むようにしている(ビルド時間の短縮)。
      # 【注意】package-lock.jsonが無い(生成されていない)ため、
      # actions/setup-nodeの標準キャッシュ機能(lockファイル必須)は
      # 使えず、package.jsonのハッシュ値をキーにした手動キャッシュに
      # している。package.jsonを変更した回のビルドは、通常通り時間が
      # かかる点に注意
      - name: 依存パッケージをキャッシュ
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 依存パッケージをインストール
        run: npm install

      - name: ビルド
        run: npm run build

      - name: ビルド成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
